name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Works out the correct base path and public URL for this repository:
      #   username.github.io            → base "/",           url https://username.github.io
      #   username.github.io/portfolio  → base "/portfolio",  url https://username.github.io/portfolio
      #   custom domain                 → base "/",           url https://your-domain.com
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm run build
        env:
          # Optional repository variables (Settings → Secrets and variables → Actions → Variables)
          # override the detected values.
          BASE_PATH: ${{ vars.BASE_PATH || steps.pages.outputs.base_path }}
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
          VITE_FORMSPREE_ID: ${{ vars.FORMSPREE_ID }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
